<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0b0f19; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        
        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 2.8rem; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: #9ca3af; margin-top: 8px; font-size: 1.1rem; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; max-width: 900px; width: 100%; }
        
        .card { background: #171e2e; border: 1px solid #2d3748; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: space-between; }
        .card h3 { color: #38bdf8; margin-bottom: 12px; font-size: 1.3rem; display: flex; align-items: center; gap: 8px; }

        .status-box { background: #0f172a; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.85rem; color: #a3e635; margin-top: 16px; min-height: 60px; word-break: break-all; }

        button { background: linear-gradient(90deg, #0284c7, #2563eb); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: transform 0.2s, opacity 0.2s; margin-top: 16px; }
        button:hover { opacity: 0.9; transform: translateY(-2px); }

        input { background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 8px; margin-top: 10px; width: 100%; font-size: 0.9rem; }
        input:focus { outline: none; border-color: #38bdf8; }
    </style>
</head>
<body>

    <header>
        <h1>Pulse Media System</h1>
        <p class="subtitle">Panel de Control & Interacción Integrada</p>
    </header>

    <div class="grid">
        <!-- Tarjeta de Música -->
        <div class="card">
            <div>
                <h3>🎵 Controlador de Música</h3>
                <p style="color: #94a3b8; font-size: 0.9rem;">Consulta el estado del servicio de música en Render.</p>
            </div>
            <button onclick="checkMusic()">Verificar Spotify Status</button>
            <div id="music-status" class="status-box">Esperando consulta...</div>
        </div>

        <!-- Tarjeta de IA -->
        <div class="card">
            <div>
                <h3>🤖 Asistente de IA</h3>
                <p style="color: #94a3b8; font-size: 0.9rem;">Envía un mensaje a la API de IA.</p>
                <input type="text" id="ai-prompt" placeholder="Escribe un prompt para Pulse...">
            </div>
            <button onclick="sendAI()">Enviar a IA</button>
            <div id="ai-status" class="status-box">Sin interacción reciente...</div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://pulse-backend-1-yj1j.onrender.com';

        async function checkMusic() {
            const box = document.getElementById('music-status');
            box.innerText = "Consultando Spotify...";
            try {
                const res = await fetch(`${BACKEND_URL}/api/music/status`);
                const data = await res.json();
                box.innerText = `[Status]: ${data.status}\n[Track]: ${data.track}\n[Info]: ${data.message}`;
            } catch (e) {
                box.innerText = "Error de conexión.";
            }
        }

        async function sendAI() {
            const prompt = document.getElementById('ai-prompt').value;
            const box = document.getElementById('ai-status');
            if(!prompt) return alert("Escribe un mensaje primero");
            
            box.innerText = "Procesando con la IA...";
            try {
                const res = await fetch(`${BACKEND_URL}/api/ai/process`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();
                box.innerText = data.response;
            } catch (e) {
                box.innerText = "Error al enviar la solicitud.";
            }
        }
    </script>
</body>
</html>
