<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE MEDIA — Independent Music Ecosystem</title>
  
  <!-- FUENTES EDITORIALES DE LUJO & MONOSPACE INDUSTRIAL -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- HOJA DE ESTILOS EXTERNA -->
  <link rel="stylesheet" href="styles.css">

  <!-- LIBRERÍAS DE NIVEL MUNDIAL (THREE.JS, GSAP, LENIS) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
</head>
<body>

  <!-- CANVAS 3D WEBGL DE FONDO -->
  <canvas id="webgl-canvas"></canvas>

  <!-- TRANSICIÓN DE CORTINA ESTUDIO -->
  <div id="page-curtain"></div>

  <!-- HEADER EDITORIAL -->
  <header>
    <a href="#" class="brand-logo" onclick="triggerCurtain(event, '#')">Pulse Media</a>
    <nav>
      <a href="#" class="nav-link" onclick="triggerCurtain(event, '#')"><span>Roster</span></a>
      <a href="#" class="nav-link" onclick="triggerCurtain(event, '#')"><span>Studio</span></a>
      <a href="#" class="nav-link" onclick="triggerCurtain(event, '#')"><span>System</span></a>
    </nav>
  </header>

  <!-- HERO ASIMÉTRICO -->
  <main>
    <section class="hero-section">
      <div class="hero-meta">
        <span>// INDEPENDENT MUSIC ECOSYSTEM</span>
        <span>GUATEMALA / GLOBAL</span>
      </div>
      <h1 class="hero-title">
        Always <br>Bringing <span class="accent-text">The Flow.</span>
      </h1>
    </section>

    <!-- MARCO EDITORIAL CON MÁSCARA ORGÁNICA -->
    <section class="editorial-frame">
      <div class="editorial-frame-text">[CREATIVE DIRECTION & PUBLISHING ARCHITECTURE]</div>
    </section>
  </main>

  <!-- SCRIPT DE LÓGICA MODULAR -->
  <script src="app.js"></script>
</body>
</html>
