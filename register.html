<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE MEDIA — Registro de Artistas y Creadores</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
</head>
<body class="theme-dark">

  <canvas id="webgl-canvas"></canvas>
  <div id="page-curtain"></div>

  <!-- HEADER SIMPLIFICADO -->
  <header>
    <a href="index.html" class="brand-logo" onclick="triggerCurtain(event, 'index.html')">Pulse Media</a>
    <nav>
      <a href="index.html" class="nav-link" onclick="triggerCurtain(event, 'index.html')"><span>← Inicio</span></a>
    </nav>
  </header>

  <main>
    <!-- SECCIÓN DE REGISTRO CON ALTURA NATURAL PARA EVITAR BLOQUEO DE SCROLL -->
    <section class="register-section" data-theme="dark" style="padding: 10rem 5% 5rem 5%; min-height: auto;">
      <div class="register-container" style="margin: 0 auto;">
        <span class="section-tag">// ACCESO AL SISTEMA</span>
        <h2 class="register-title">Crear Cuenta en <span class="accent-text">Pulse</span></h2>
        <p class="register-sub">Envía tu propuesta para unirte a nuestro ecosistema de distribución y dirección creativa.</p>
        
        <form class="register-form" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label>Nombre del Artista / Proyecto</label>
            <input type="text" placeholder="Ej. Elías El Klan" required>
          </div>
          <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" placeholder="contacto@pulselabel.com" required>
          </div>
          <div class="form-group">
            <label>Género Principal</label>
            <select required>
              <option value="" disabled selected>Selecciona un género</option>
              <option value="urbano">Urbano / Trap / Reggaeton</option>
              <option value="regional">Regional Mexicano / Corridos</option>
              <option value="alternativo">Fusión / Alternativo</option>
            </select>
          </div>
          <div class="form-group">
            <label>Enlace de Referencia (Spotify, SoundCloud o Demo)</label>
            <input type="url" placeholder="https://soundcloud.com/tu-demo" required>
          </div>
          <button type="submit" class="submit-btn">Inicializar Registro</button>
        </form>
      </div>
    </section>
  </main>

  <footer style="margin-top: 3rem;">
    <div>&copy; 2025 - 2026 PULSE MEDIA PUBLISHING</div>
    <div>GUATEMALA // GLOBAL OPS</div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
