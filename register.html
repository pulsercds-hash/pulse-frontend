<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE MEDIA — Registro & Acceso</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <style>
    /* RESET Y SCROLL NATIVO FLUIDO */
    *, *::before, *::after {
      box-sizing: border-box !important;
    }

    html, body {
      background: #000 !important;
      color: #fff !important;
      font-family: var(--font-display);
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden !important;
      overflow-y: auto !important;
      position: static !important;
      margin: 0;
      padding: 0;
    }

    /* HEADER FIJO RESPETANDO NAVEGACIÓN */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1.8rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, transparent 100%);
      pointer-events: none;
    }

    header * {
      pointer-events: auto;
    }

    .btn-back-home {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: #fff;
      text-decoration: none;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    .btn-back-home:hover {
      color: var(--accent-neon);
    }

    /* WRAPPER PRINCIPAL CON PADDING ALTO PARA NO TOCAR EL HEADER */
    .register-hero-wrapper {
      position: relative;
      width: 100%;
      min-height: 100vh;
      padding: 15rem 5% 6rem; /* 15rem para dejar libre el área del header */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
    }

    /* VIDEO DE FONDO */
    .register-video-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .register-video-bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.28;
      filter: contrast(1.15) brightness(0.5);
    }

    .register-video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.96) 100%);
    }

    /* CONTENEDOR ANCHO Y CENTRADO */
    .register-container {
      max-width: 680px;
      width: 100%;
      position: relative;
      z-index: 2;
      margin: 0 auto;
    }

    .register-header-meta {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 0.8rem;
      display: flex;
      justify-content: space-between;
    }

    .register-title {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      margin-bottom: 2rem;
      text-align: center;
      line-height: 1.2;
    }

    /* PESTAÑAS REGISTRO / LOGIN */
    .auth-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 0.5rem;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0.8rem 0;
      cursor: pointer;
      transition: all 0.3s ease;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: #fff;
      border-bottom: 2px solid var(--accent-neon);
    }

    /* TARJETA DEL FORMULARIO CON ANCHO CORREGIDO */
    .form-card-secure {
      width: 100%;
      background: rgba(12, 12, 12, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 2.2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.85);
    }

    .input-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      width: 100%;
    }

    @media (max-width: 600px) {
      .input-grid-2 {
        grid-template-columns: 1fr;
      }
      .form-card-secure {
        padding: 1.5rem;
      }
    }

    .input-group {
      margin-bottom: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: 100%;
    }

    .input-group label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.75);
      font-weight: 700;
    }

    .input-group input, 
    .input-group select {
      width: 100%;
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      padding: 0.85rem 1rem;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .input-group input:focus, 
    .input-group select:focus {
      border-color: var(--accent-neon);
      box-shadow: 0 0 10px rgba(220, 255, 0, 0.15);
    }

    /* BOTÓN PRINCIPAL */
    .btn-submit-secure {
      width: 100%;
      background: var(--accent-neon);
      color: #000;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 1.1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease, box-shadow 0.3s ease;
      margin-top: 1rem;
    }

    .btn-submit-secure:hover {
      background: #fff;
      box-shadow: 0 0 20px rgba(220, 255, 0, 0.35);
      transform: translateY(-2px);
    }

    .auth-section {
      display: none;
      width: 100%;
    }

    .auth-section.active {
      display: block;
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .verification-notice {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.5;
      margin-bottom: 1.5rem;
      border-left: 2px solid var(--accent-neon);
      padding-left: 1rem;
    }
  </style>
</head>
<body class="theme-dark">

  <div id="page-curtain"></div>

  <!-- HEADER FIJO -->
  <header>
    <a href="index.html" class="brand-logo" onclick="triggerCurtain(event, 'index.html')">Pulse Media</a>
    <a href="index.html" class="btn-back-home" onclick="triggerCurtain(event, 'index.html')">&larr; INICIO</a>
  </header>

  <main class="register-hero-wrapper">
    
    <!-- VIDEO DE FONDO -->
    <div class="register-video-bg">
      <video autoplay muted loop playsinline preload="auto">
        <source src="videos/fondoregistro.mp4" type="video/mp4">
      </video>
      <div class="register-video-overlay"></div>
    </div>

    <div class="register-container">
      <div class="register-header-meta">
        <span>// SECURE GATEWAY</span>
        <span>SISTEMA DE ACCESO</span>
      </div>
      
      <h1 class="register-title">Acreditación <span class="accent-green-font" style="font-family: 'Cinzel Decorative', serif; color: var(--accent-neon);">Oficial</span></h1>

      <!-- PESTAÑAS -->
      <div class="auth-tabs">
        <button class="tab-btn active" onclick="switchTab('register')">Nuevo Registro</button>
        <button class="tab-btn" onclick="switchTab('login')">Iniciar Sesión</button>
      </div>

      <div class="form-card-secure">

        <!-- BLOQUE 1: NUEVO REGISTRO -->
        <div id="sectionRegister" class="auth-section active">
          <form id="artistRegisterForm" onsubmit="handleRegister(event)">
            
            <div class="input-grid-2">
              <div class="input-group">
                <label for="firstName">Nombre</label>
                <input type="text" id="firstName" required placeholder="Nombre">
              </div>
              <div class="input-group">
                <label for="lastName">Apellido</label>
                <input type="text" id="lastName" required placeholder="Apellido">
              </div>
            </div>

            <div class="input-group">
              <label for="artistName">Nombre Artístico / Proyecto</label>
              <input type="text" id="artistName" required placeholder="Nombre Artístico">
            </div>

            <div class="input-group">
              <label for="email">Correo Electrónico</label>
              <input type="email" id="email" required placeholder="ejemplo@correo.com">
            </div>

            <div class="input-group">
              <label for="registerPassword">Crear Contraseña</label>
              <input type="password" id="registerPassword" required placeholder="••••••••">
            </div>

            <div class="input-grid-2">
              <div class="input-group">
                <label for="birthDate">Fecha de Nacimiento</label>
                <input type="date" id="birthDate" required style="color-scheme: dark;">
              </div>

              <div class="input-group">
                <label for="country">País de Operación</label>
                <select id="country" required>
                  <option value="" disabled selected>Selecciona tu país</option>
                  <option value="Guatemala">Guatemala</option>
                  <option value="México">México</option>
                  <option value="Estados Unidos">Estados Unidos</option>
                  <option value="Canadá">Canadá</option>
                  <option value="El Salvador">El Salvador</option>
                  <option value="Honduras">Honduras</option>
                  <option value="Costa Rica">Costa Rica</option>
                  <option value="Panamá">Panamá</option>
                  <option value="Nicaragua">Nicaragua</option>
                  <option value="Puerto Rico">Puerto Rico</option>
                  <option value="República Dominicana">República Dominicana</option>
                  <option value="Colombia">Colombia</option>
                  <option value="Argentina">Argentina</option>
                  <option value="Chile">Chile</option>
                  <option value="Perú">Perú</option>
                  <option value="Ecuador">Ecuador</option>
                  <option value="Venezuela">Venezuela</option>
                  <option value="Uruguay">Uruguay</option>
                  <option value="Bolivia">Bolivia</option>
                  <option value="Paraguay">Paraguay</option>
                  <option value="Brasil">Brasil</option>
                  <option value="España">España</option>
                  <option value="Reino Unido">Reino Unido</option>
                  <option value="Francia">Francia</option>
                  <option value="Alemania">Alemania</option>
                  <option value="Italia">Italia</option>
                  <option value="Otro Global">Otro País / Global</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn-submit-secure">Enviar y Solicitar Código</button>
          </form>

          <!-- VERIFICACIÓN DE CÓDIGO -->
          <div id="verificationSection" style="display: none; margin-top: 1rem;">
            <div class="verification-notice">
              // CÓDIGO ENVIADO A TU CORREO. Ingresa el código de 6 dígitos para validar tu cuenta por primera vez.
            </div>
            <form onsubmit="handleVerifyCode(event)">
              <div class="input-group">
                <label for="accessCode">Código de Activación (6 Dígitos)</label>
                <input type="text" id="accessCode" required maxlength="6" placeholder="000000" style="text-align: center; letter-spacing: 6px; font-size: 1.3rem;">
              </div>
              <button type="submit" class="btn-submit-secure">Activar Cuenta e Ingresar</button>
            </form>
          </div>
        </div>

        <!-- BLOQUE 2: INICIAR SESIÓN -->
        <div id="sectionLogin" class="auth-section">
          <form onsubmit="handleLogin(event)">
            <div class="input-group">
              <label for="loginEmail">Correo Electrónico</label>
              <input type="email" id="loginEmail" required placeholder="ejemplo@correo.com">
            </div>

            <div class="input-group">
              <label for="loginPassword">Contraseña</label>
              <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit-secure">Iniciar Sesión</button>
          </form>
        </div>

      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div>&copy; 2025 - 2026 PULSE MEDIA PUBLISHING</div>
    <div>GUATEMALA // GLOBAL OPS</div>
  </footer>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.auth-section').forEach(sec => sec.classList.remove('active'));

      if (tab === 'register') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('sectionRegister').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('sectionLogin').classList.add('active');
      }
    }

    function handleRegister(event) {
      event.preventDefault();
      document.getElementById('artistRegisterForm').style.display = 'none';
      document.getElementById('verificationSection').style.display = 'block';
    }

    function handleVerifyCode(event) {
      event.preventDefault();
      const code = document.getElementById('accessCode').value;
      alert("Cuenta activada con éxito. ¡Bienvenido!");
    }

    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('loginEmail').value;
      alert("Iniciando sesión para: " + email);
    }
  </script>

  <script src="app.js"></script>
</body>
</html>
